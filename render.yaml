# Render.com blueprint for TraceLine (hackathon prototype).
# Two free services: a FastAPI/uvicorn API (with SQLite on a persistent disk)
# and a Vite-preview SPA frontend.
# Docs: https://render.com/docs/blueprint-spec

databases: []  # SQLite persistent disk is used (no external Postgres required).

services:
  # ---- Backend API -----------------------------------------------------
  - type: web
    name: traceline-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      # Persistent SQLite DB + audit log live on the disk.
      - key: TRACELINE_DATABASE_URL
        value: sqlite:////app/data/traceline.db
      - key: TRACELINE_AUDIT_LOG
        value: /app/data/audit.log
      # Allow the deployed frontend host (default already includes the Render
      # UI origin in code; kept here for explicit overrides if needed).
      - key: TRACELINE_ALLOWED_ORIGINS
        value: https://traceline-ui.onrender.com
    disk:
      name: traceline-data
      mountPath: /app/data
      sizeGB: 1

  # ---- Frontend SPA ----------------------------------------------------
  - type: web
    name: traceline-ui
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    # Vite preview serves the built SPA with client-side routing fallback.
    startCommand: npx vite preview --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      # The deployed backend API host. Baked into the bundle at build time so
      # SPA calls hit the API service directly.
      - key: VITE_API_BASE
        value: https://traceline-api.onrender.com
    disk:
      name: traceline-ui-cache
      mountPath: /opt/render/project/.npm-cache
      sizeGB: 1
