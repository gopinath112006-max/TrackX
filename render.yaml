# Render.com blueprint for TraceLine (hackathon prototype).
# Two free services: a FastAPI/uvicorn API and a Vite-preview SPA frontend.
# Docs: https://render.com/docs/blueprint-spec
# NOTE: Render free tier has no persistent disks, so the SQLite DB + audit log
# live in the service's ephemeral filesystem (reset on restart). The full demo
# works within a running instance; persistence across restarts requires a paid
# tier or external DB.

databases: []  # SQLite is used (no external Postgres required on free tier).

services:
  # ---- Backend API -----------------------------------------------------
  - type: web
    name: traceline-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      # SQLite + audit log use the app's default paths (backend/ dir) so no
      # disk mount is required. Data is ephemeral on free tier.
      - key: TRACELINE_ALLOWED_ORIGINS
        value: https://traceline-ui.onrender.com

  # ---- Frontend SPA ----------------------------------------------------
  - type: web
    name: traceline-ui
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    # Vite preview serves the built SPA with client-side routing fallback.
    startCommand: npx vite preview --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      # The deployed backend API host. Baked into the bundle at build time so
      # SPA calls hit the API service directly.
      - key: VITE_API_BASE
        value: https://traceline-api.onrender.com
