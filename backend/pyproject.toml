[project]
name = "traceline-backend"
version = "1.0.0"
description = "Digital Forensics Attack Story Reconstruction System (FastAPI)"
requires-python = "~=3.12.0"
dependencies = [
  "fastapi>=0.115, <1.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.13, <3",
  "pydantic-settings>=2.0",
  "sqlalchemy>=2.0",
  "python-multipart>=0.0.9",
  "pandas>=2.0",
  "aiofiles>=24.0",
  "pytest>=8.0",
  "httpx>=0.27.0",
  "networkx>=3.0",
  "PyYAML>=6.0",
  "Jinja2>=3.1",
  "psycopg2-binary>=2.9",
]

[tool.vercel]
entrypoint = "app.main:app"
