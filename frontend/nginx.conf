# TraceLine UI nginx configuration.
# Serves the built SPA and proxies API requests to the backend container.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The SPA uses client-side routing; fall back to index.html for any path.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy the API to the traceline-api container.
    location /api/ {
        proxy_pass http://traceline-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Required for the /api/analysis/progress SSE stream (FR-14):
        # pass events through without buffering.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        add_header X-Accel-Buffering no;
    }
}
